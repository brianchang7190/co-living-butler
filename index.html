<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合租生活管家</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --brand: #4f6ef7;
      --brand-2: #7c5cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #eef1ff 0%, #f6f7fb 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--ink);
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(31, 41, 55, 0.10);
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #fff;
      margin-bottom: 20px;
    }
    h1 { font-size: 28px; letter-spacing: 1px; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.7; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #eef1ff;
      color: var(--brand);
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏠</div>
    <h1>合租生活管家</h1>
    <p>让合租生活更省心 —— 费用 AA 分摊、清洁值日排班、公共物品登记提醒、室友公约管理。</p>
    <div class="badge">🚀 页面部署成功，功能持续迭代中</div>
  </div>
</body>
</html>
