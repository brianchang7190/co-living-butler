<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f2" />
  <title>合租生活管家</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark">合</span>
        <div class="brand-text">
          <h1>合租生活管家</h1>
          <p id="houseLabel">和 4 位室友同住</p>
        </div>
      </div>
      <button class="icon-btn" id="roommatesBtn" data-action="openRoommates" aria-label="室友管理" title="室友管理">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
    </header>

    <main class="main">
      <!-- 首页 -->
      <section class="view is-active" data-view="home">
        <div class="greeting">
          <h2 id="greetingTitle">晚上好</h2>
          <p id="todayDate">今天</p>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-label">本月支出</span>
            <span class="stat-value mono" id="statExpense">¥0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">待结算</span>
            <span class="stat-value mono" id="statSettle">¥0</span>
          </div>
        </div>

        <div class="section-head">
          <h3>今日值日</h3>
          <button class="link-btn" data-goto="duty">查看排班 →</button>
        </div>
        <div class="card-list" id="homeDuty"></div>

        <div class="section-head">
          <h3>需要补货</h3>
          <button class="link-btn" data-goto="items">物品库 →</button>
        </div>
        <div class="card-list" id="homeItems"></div>

        <div class="section-head">
          <h3>待确认公约</h3>
          <button class="link-btn" data-goto="rules">公约 →</button>
        </div>
        <div class="card-list" id="homeRules"></div>
      </section>

      <!-- 费用 -->
      <section class="view" data-view="bills">
        <div class="section-head">
          <h2>费用分摊</h2>
          <button class="primary-btn" id="addBillBtn" data-action="addBill">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            记一笔
          </button>
        </div>

        <div class="summary-panel">
          <div class="summary-row">
            <span>本月总支出</span>
            <span class="mono strong" id="billTotal">¥0</span>
          </div>
          <div class="summary-row">
            <span>人均（按人头）</span>
            <span class="mono" id="billAvg">¥0</span>
          </div>
          <div class="category-bars" id="billCategories"></div>
        </div>

        <div class="settle-panel" id="settlePanel"></div>

        <div class="filter-bar" id="billFilters">
          <select id="fType"><option value="">全部类型</option></select>
          <select id="fMonth"><option value="">全部月份</option></select>
          <select id="fPayer"><option value="">全部付款人</option></select>
          <select id="fStatus"><option value="">全部状态</option><option value="open">未结</option><option value="settled">已结</option></select>
          <button class="ghost-btn" id="exportBtn" data-action="exportCsv">导出 CSV</button>
        </div>

        <div class="section-head">
          <h3>账单明细</h3>
          <span class="muted" id="billCount"></span>
        </div>
        <div class="card-list" id="billList"></div>
      </section>

      <!-- 值日 -->
      <section class="view" data-view="duty">
        <div class="section-head">
          <h2>清洁值日</h2>
          <button class="icon-btn" id="rotateBtn" data-action="rotate" title="轮换下一周" aria-label="轮换下一周">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>

        <div class="week-banner" id="weekBanner">本周</div>

        <div class="seg" id="dutySeg">
          <button class="seg-btn is-active" data-dutyview="list">本周排班</button>
          <button class="seg-btn" data-dutyview="calendar">日历视图</button>
        </div>

        <div id="dutyListView">
          <div class="duty-list" id="dutyList"></div>
        </div>

        <div id="dutyCalendarView" hidden>
          <div class="calendar" id="dutyCalendar"></div>
        </div>

        <div class="section-head">
          <h3>谁做得多（近14天）</h3>
        </div>
        <div class="card-list" id="dutyStats"></div>

        <div class="section-head">
          <h3>清洁任务</h3>
          <button class="primary-btn" id="addDutyBtn" data-action="addDuty">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            添加任务
          </button>
        </div>
        <div class="card-list" id="taskList"></div>
      </section>

      <!-- 物品 -->
      <section class="view" data-view="items">
        <div class="section-head">
          <h2>公共物品</h2>
          <button class="primary-btn" id="addItemBtn" data-action="addItem">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            登记物品
          </button>
        </div>

        <div class="stock-banner" id="stockBanner"></div>

        <div class="card-list" id="itemList"></div>
      </section>

      <!-- 公约 -->
      <section class="view" data-view="rules">
        <div class="section-head">
          <h2>室友公约</h2>
          <button class="primary-btn" id="addRuleBtn" data-action="addRule">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            发起公约
          </button>
        </div>

        <div class="rule-list" id="ruleList"></div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab is-active" data-tab="home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-tab="bills">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        <span>费用</span>
      </button>
      <button class="tab" data-tab="duty">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h4l2 4h8l2-4h-4"/><path d="M5 6l1 14h12l1-14"/><circle cx="9" cy="21" r="0.5"/></svg>
        <span>值日</span>
      </button>
      <button class="tab" data-tab="items">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        <span>物品</span>
      </button>
      <button class="tab" data-tab="rules">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>
        <span>公约</span>
      </button>
    </nav>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-backdrop" id="modalBackdrop" hidden></div>
  <div class="modal" id="modal" hidden>
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn" id="modalClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
